services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: devisio
      POSTGRES_PASSWORD: devisio_dev
      POSTGRES_DB: devisio
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - devisio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devisio -d devisio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devisio_pgdata:
